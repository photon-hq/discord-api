name: Release

# Self-updating package: the daily `update-discord-openapi` workflow vendors the
# spec, auto-merges additive changes, and this workflow publishes on that merge.
# The version is derived from the spec (see scripts/compute-version.ts).
on:
  push:
    branches: [main]
    paths:
      - specs/discord-api.openapi.json
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write # create git tags and GitHub releases
  id-token: write # npm Trusted Publishing (OIDC)

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # Full history + tags so compute-version can diff the spec against the
          # last release tag (git show v<version>:specs/...).
          fetch-depth: 0
          fetch-tags: true

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.2.19

      - run: bun install --frozen-lockfile

      # Run the full pipeline as a release gate so a broken build can never reach
      # npm. The publish block below re-runs install + build in the package dir.
      - name: Generate client + build
        run: |
          bun run generate:client
          bun run build

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun run test

      # Writes version / should_publish / discord_version / published_version to
      # $GITHUB_OUTPUT. should_publish is false when the spec is unchanged since
      # the last release tag, making re-runs on an unchanged commit a no-op.
      - name: Compute next version
        id: version
        run: bun run compute:version

      - name: Set package version
        if: steps.version.outputs.should_publish == 'true'
        working-directory: packages/discord-ts
        run: npm pkg set version=${{ steps.version.outputs.version }}

      # buildspace publish-npm: OIDC Trusted Publishing + provenance, NPM_TOKEN
      # fallback, and a post-publish check that the version landed on the
      # registry. Runs its own install + build in the package dir.
      - name: Publish to npm
        if: steps.version.outputs.should_publish == 'true'
        uses: photon-hq/buildspace/.github/blocks/publish-npm@main
        with:
          bun-version: 1.2.19
          working-directory: packages/discord-ts
          build-command: bun run build
          tag: latest
          npm-token: ${{ secrets.NPM_TOKEN }}

      # buildspace create-github-release: creates the `v<version>` tag + Release
      # at this commit (which compute-version diffs the spec against next run).
      - name: Tag + GitHub Release
        if: steps.version.outputs.should_publish == 'true'
        uses: photon-hq/buildspace/.github/blocks/create-github-release@main
        with:
          version: ${{ steps.version.outputs.version }}
          title: v${{ steps.version.outputs.version }}
          notes: "Discord API v${{ steps.version.outputs.discord_version }} — published `@photon-ai/discord-ts@${{ steps.version.outputs.version }}`."
          tag-prefix: v
